spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tenant_management}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-please-32-bytes}
    access-token-minutes: 30
    refresh-token-days: 7
