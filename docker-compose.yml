services:
  postgres:
    image: postgres:15
    container_name: ttcs-tenant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tenant_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tenant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenant_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tenant_postgres_data:
