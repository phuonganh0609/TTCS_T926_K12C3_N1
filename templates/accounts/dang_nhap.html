{% extends 'base.html' %}

{% block title %}Đăng Nhập — Quản Lý Phòng Trọ{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
            <div class="card card-custom p-4 p-sm-5 bg-white">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 64px; height: 64px;">
                        <i class="bi bi-box-arrow-in-right fs-2"></i>
                    </div>
                    <h2 class="fw-bold h4 mb-1">Đăng nhập</h2>
                    <p class="text-muted small mb-0">Truy cập hệ thống quản lý phòng trọ</p>
                </div>

                {% if error_message %}
                    <div class="alert alert-danger py-2 small mb-3">
                        <i class="bi bi-exclamation-circle me-1"></i>{{ error_message }}
                    </div>
                {% endif %}

                <form method="post" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="email_or_phone" class="form-label fw-semibold small">
                            Email hoặc Số điện thoại <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                            <input type="text"
                                   name="email_or_phone"
                                   id="email_or_phone"
                                   class="form-control"
                                   placeholder="Email hoặc 10 số ĐT"
                                   required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="mat_khau" class="form-label fw-semibold small">
                            Mật khẩu <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password"
                                   name="mat_khau"
                                   id="mat_khau"
                                   class="form-control"
                                   placeholder="Nhập mật khẩu"
                                   required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                        </button>
                    </div>
                </form>

                <div class="text-center border-top pt-3 mt-2">
                    <span class="text-muted small">Chưa có tài khoản?</span>
                    <a href="{% url 'dang_ky' %}" class="text-primary small fw-semibold text-decoration-none ms-1">
                        Đăng ký ngay
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
